<meta name="mobile-web-app-capable" content="yes">

<title>Pocket Ledger</title>
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icon-192.png">

<style>
:root{
  /* Layout: 6-column grid with wide margins. Dates hang in column 1; figures are the only display type. Light only. */
  --bg:#FFFFFF;
  --ink:#111111;
  --muted:#8E8E8E;
  --line:#ECECEC;
  --soft:#F4F4F2;
  --warn:#B4561B;
  --display:"Instrument Serif","Iowan Old Style","Times New Roman",serif;
  --body:"Geist",ui-sans-serif,system-ui,-apple-system,"PingFang HK","Noto Sans HK",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px;border-radius:4px}
.app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) max(24px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 100px) max(24px,env(safe-area-inset-left))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.top b{font-weight:500}
.top a{color:var(--muted);text-decoration:none}
h2{font:400 40px/1 var(--display);letter-spacing:-.01em;margin:52px 0 0}
.sub{margin:8px 0 0;font-size:14px;color:var(--muted)}
.fig{font:400 104px/.9 var(--display);letter-spacing:-.035em;margin:10px 0 0 -.05em;display:flex;align-items:flex-start}
.fig small{font:400 15px/1 var(--body);letter-spacing:0;color:var(--muted);margin:14px 8px 0 .05em}
.fig.md{font-size:64px;margin-top:6px}
.fig.md small{margin-top:8px}
.fig.long{font-size:clamp(54px,17vw,84px)}
.fig.longer{font-size:clamp(38px,12vw,64px)}
.fig{min-width:0;white-space:nowrap}
.meter{height:2px;background:var(--line);margin-top:18px}
.meter i{display:block;height:100%;background:var(--ink)}
.meter.over i{background:var(--warn)}

.in{display:block;width:100%;min-width:0;padding:10px 0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;font-size:20px;outline:none;-webkit-appearance:none;appearance:none}
.in:focus{border-bottom-color:var(--ink)}
.in::placeholder{color:#C2C2C2}
.in:disabled{color:var(--muted)}
.in.sm{font-size:16px}
select.in{font-size:16px}
textarea.in{font-size:12px;height:120px;resize:vertical}
.amt{position:relative}
.amt .in{text-align:right;padding-left:40px}
.amt>span[aria-hidden="true"]{position:absolute;left:0;bottom:15px;font-size:14px;color:var(--muted);pointer-events:none}
.amt>span.sm[aria-hidden="true"]{bottom:13px}
.cap{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);column-gap:20px;margin-top:52px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:20px}
.fld{display:block;margin-top:18px}
.fld>span:first-child{display:block;font-size:12px;color:var(--muted)}
.recent{display:flex;flex-wrap:wrap;gap:2px 18px;margin-top:14px}
.recent button{border:0;background:none;padding:4px 0;font-size:14px;color:var(--muted)}
.acts{display:flex;align-items:center;flex-wrap:wrap;gap:4px 20px;margin-top:18px}
.link{position:relative;border:0;background:none;padding:8px 0;font-size:14px;color:var(--muted);text-decoration:none;overflow:hidden}
.link.ink,.link[aria-pressed="true"]{color:var(--ink)}
.link.warn{color:var(--warn)}
.link input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;cursor:pointer}
.btn{height:44px;padding:0 24px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-size:15px;font-weight:500;white-space:nowrap}
.btn:disabled{opacity:.3}
.push{margin-left:auto}
.err{margin:12px 0 0;font-size:13px;color:var(--warn)}
.err:empty{display:none}
.note{margin:12px 0 0;font-size:13px;color:var(--muted);max-width:60ch}
.note.warn{color:var(--warn)}

.list{margin-top:44px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;column-gap:16px;align-items:baseline;width:100%;padding:13px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:16px}
.row .nm{overflow-wrap:anywhere}
.row .meta{font-size:13px;color:var(--muted)}
.row .meta.warn{color:var(--warn)}
.row.repayment .nm,.row.repayment .v{color:var(--muted)}
.row.unknown .nm{letter-spacing:.12em}
.v,.in,.fig,.total{font-variant-numeric:tabular-nums}
.v{text-align:right;white-space:nowrap}
.empty{padding:14px 0;font-size:14px;color:var(--muted)}
.foot{margin-top:40px;font-size:13px;color:var(--muted)}
.foot .link{padding:0;font-size:13px;color:var(--ink)}

.filters{display:flex;flex-wrap:wrap;gap:0 20px;margin-top:28px}
.day{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));column-gap:16px;margin-top:28px}
.day .d{grid-column:1/2;padding-top:12px;font-size:12px;line-height:1.3;color:var(--muted)}
.day .d b{display:block;font:400 28px/1 var(--display);color:var(--ink);margin-bottom:3px}
.day .items{grid-column:2/7}
.day .total{padding-top:10px;text-align:right;font-size:13px;color:var(--muted)}

.sec{margin-top:52px}
.sec>h3{display:flex;justify-content:space-between;gap:16px;margin:0 0 4px;font-size:13px;font-weight:500;color:var(--muted)}
.sec>h3 .link{padding:0;font-size:13px;font-weight:400}
.line{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
.line small{display:block;font-size:12px;color:var(--muted)}
.line>span:first-child{min-width:0;overflow-wrap:anywhere}
.line>.v{flex:none}
.item{padding:14px 0;border-bottom:1px solid var(--line)}
.item .line{padding:0;border:0}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.opts button{border:0;border-radius:999px;background:var(--soft);min-height:40px;padding:9px 12px;font-size:14px}
.opts button[aria-pressed="true"]{background:var(--ink);color:#fff}
.cat{padding:12px 0;border-bottom:1px solid var(--line)}
.cat .line{padding:0;border:0}
.cat .bar{height:2px;margin-top:8px;background:var(--line)}
.cat .bar i{display:block;height:100%;background:var(--ink)}
.cat.flag .line span:first-child{color:var(--muted)}
.cat.flag .bar i{background:var(--muted)}

.sw{position:relative;flex:none;width:40px;height:24px}
.sw input{position:absolute;inset:0;z-index:1;margin:0;opacity:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background-color .2s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.sw input:checked+span{background:var(--ink)}
.sw input:checked+span::after{transform:translateX(16px)}
.sw input:focus-visible+span{outline:1.5px solid var(--ink);outline-offset:3px}
.models button{display:flex;justify-content:space-between;gap:16px;width:100%;padding:11px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:14px}
.models button span:first-child{min-width:0;overflow-wrap:anywhere}
.models button span:last-child{flex:none;font-size:12px;color:var(--muted);white-space:nowrap}
.models button[aria-pressed="true"]{font-weight:500}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:4px 0 4px 12px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding:0 max(12px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(12px,env(safe-area-inset-left))}
.tabs nav{display:grid;grid-template-columns:repeat(4,1fr);max-width:520px;margin:0 auto}
.tabs a{display:flex;align-items:center;justify-content:center;gap:5px;height:54px;font-size:14px;color:var(--muted);text-decoration:none}
.tabs a[aria-current="page"]{color:var(--ink);font-weight:500}
.tabs .count{font-size:12px;font-weight:400;color:var(--warn)}

.scrim{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.18);animation:fade .18s ease-out}
.sheet{width:100%;max-width:520px;max-height:92%;max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:20px 20px 0 0;padding:28px max(24px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 24px) max(24px,env(safe-area-inset-left));animation:up .22s cubic-bezier(.2,.8,.2,1)}
body.dialog-open{overflow:hidden}
.sheet h3{font:400 28px/1 var(--display);margin:0 0 16px}
.types{display:flex;flex-wrap:wrap;gap:0 20px}
.types button{border:0;border-bottom:1px solid transparent;background:none;padding:6px 0;font-size:14px;color:var(--muted)}
.types button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 66px);z-index:30;transform:translateX(-50%);display:flex;align-items:center;gap:16px;width:min(472px,calc(100% - 32px));padding:12px 16px;border-radius:12px;background:var(--ink);color:#fff;font-size:14px;line-height:1.35;animation:fade .2s ease-out}
.toast button{flex:none;margin-left:auto;border:0;background:none;color:#fff;font-weight:500;padding:4px 0}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.fig{font-size:84px}}
</style>
<style>
/* Pocket Ledger visual system */
:root{
  --accent:#3155DC;
  --accent-dark:#2441BC;
  --accent-soft:#EEF2FF;
  --accent-outline:#D8E1FF;
  --ink:#17191E;
  --muted:#747982;
  --line:#E8E9EC;
  --soft:#F6F7F9;
  --bg:#FFFFFF;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.app{padding-top:calc(env(safe-area-inset-top) + 24px)}
.top{align-items:center;min-height:30px;font-size:13px}
.top b{display:inline-flex;align-items:center;gap:9px;font-size:14px;font-weight:500;letter-spacing:-.025em}
.top a{transition:color .2s}
.top a:hover,.top a[aria-current="page"]{color:var(--accent)}
.brand-mark{display:inline-grid;place-items:center;flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent)}
.brand-mark::after{content:"";display:block;width:12px;height:12px;border-top:2px solid white;border-bottom:2px solid white;background:linear-gradient(white,white) center/12px 2px no-repeat;transform:rotate(-8deg)}
h2{margin-top:42px;font-size:clamp(40px,10vw,48px)}
.sub{color:var(--muted)}
.eyebrow{display:flex;align-items:center;gap:7px;color:var(--accent);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.hero{margin-top:48px}
.hero-title{font:400 clamp(38px,10vw,48px)/1.05 var(--display);letter-spacing:-.02em;margin:16px 0 0}
.hero .fig{font-size:clamp(78px,22vw,108px);margin-top:16px}
.hero .fig.long{font-size:clamp(56px,17vw,84px)}
.hero .fig.longer{font-size:clamp(39px,12vw,64px)}
.hero .fig small{color:var(--muted)}
.hero .fig small:first-child{color:var(--accent);font-weight:500}
.hero-footer{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-top:19px}
.hero-footer .budget-remain{font-size:14px;color:var(--ink);font-weight:500}
.hero-footer .budget-context{font-size:12px;color:var(--muted);white-space:nowrap}
.meter{overflow:hidden;height:5px;border-radius:20px;background:var(--soft);margin-top:13px}
.meter i{display:block;height:100%;border-radius:20px;background:var(--accent);transform-origin:left;animation:fillAcross .55s cubic-bezier(.16,1,.3,1) both}
.meter.over i{background:var(--warn)}
.capture-card{margin-top:43px;padding:23px 21px 20px;border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 7px 35px rgba(15,20,45,.035)}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.section-head h3{font-size:17px;font-weight:500;letter-spacing:-.035em;line-height:1.3;margin:0}
.section-head span{font-size:12px;color:var(--muted)}
.capture-card .cap{margin-top:14px;column-gap:14px}
.capture-card .in{font-size:19px}
.capture-card .amt .in{font-size:19px}
.capture-card .acts{margin-top:20px;gap:4px 14px}
.capture-card .link{font-size:13px}
.capture-card .recent button{border-radius:7px;color:var(--accent);transition:color .16s,background-color .16s}
.capture-card .recent button:hover{background:var(--accent-soft)}
.history{margin-top:37px}
.history .list{margin-top:11px}
.btn{height:43px;background:var(--accent);box-shadow:0 3px 10px rgba(49,85,220,.12);transition:transform .18s ease,background-color .18s ease,box-shadow .18s ease}
.btn:hover:not(:disabled){background:var(--accent-dark);box-shadow:0 5px 16px rgba(49,85,220,.23)}
.btn:active:not(:disabled){transform:scale(.965)}
.btn:disabled{background:#B4B8C3;color:white;box-shadow:none;opacity:1}
.link{transition:color .16s ease,opacity .16s ease}
.link.ink,.link[aria-pressed="true"]{color:var(--accent)}
.link:active,.row:active,.opts button:active,.models button:active{opacity:.65}
.in{transition:border-color .16s ease}
.in:focus{border-bottom-color:var(--accent)}
.in::placeholder{color:#A9ADB8}
.row{border-radius:8px;transition:background-color .18s ease,padding .18s ease}
.row:hover{background:var(--soft);padding-left:8px;padding-right:8px}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list .empty{padding:23px 0}
.sec{margin-top:42px;padding-top:23px;border-top:1px solid var(--line)}
.sec>h3{font-size:17px;letter-spacing:-.025em;font-weight:500;color:var(--ink);align-items:baseline;margin-bottom:10px}
.sec>h3>span+span{font-size:12px;font-weight:400;letter-spacing:0;color:var(--muted)}
.sec>h3 .link{font-size:13px}
.cat .bar{height:4px;background:var(--soft);border-radius:4px;overflow:hidden}
.cat .bar i{border-radius:4px;background:var(--accent);transform-origin:left;animation:fillAcross .48s ease-out both}
.opts button{transition:background-color .15s,color .15s,transform .15s}
.opts button[aria-pressed="true"]{background:var(--accent);color:white}
.opts button:hover:not([aria-pressed="true"]){background:var(--accent-soft);color:var(--accent)}
.sw input:checked+span{background:var(--accent)}
.tabs{border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(16,20,34,.025)}
.tabs a{position:relative;font-size:13px;transition:color .22s ease}
.tabs a::before{content:"";position:absolute;top:0;left:calc(50% - 16px);width:32px;height:3px;border-radius:0 0 5px 5px;background:var(--accent);transform:scaleX(0);transition:transform .24s cubic-bezier(.16,1,.3,1)}
.tabs a[aria-current="page"]{color:var(--accent);font-weight:500}
.tabs a[aria-current="page"]::before{transform:scaleX(1)}
.tabs .count{color:var(--accent)}
.sheet{box-shadow:0 -16px 55px rgba(18,26,50,.10)}
.types button{transition:color .2s,border-color .2s}
.types button[aria-pressed="true"]{border-bottom-color:var(--accent);color:var(--accent)}
.toast{background:#20294C;animation:toastIn .24s cubic-bezier(.16,1,.3,1) both}
.app.is-entering{animation:pageIn .26s cubic-bezier(.16,1,.3,1) both}
.install-card{display:grid;grid-template-columns:30px minmax(0,1fr);gap:13px;margin-top:30px;padding:17px 17px 16px;border:1px solid var(--accent-outline);border-radius:17px;background:var(--accent-soft)}
.install-symbol{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--accent);color:white;font-size:21px;font-weight:400;line-height:1}
.install-card strong{display:block;font-size:14px;font-weight:500;color:var(--ink)}
.install-card p{margin:3px 0 8px;font-size:12px;line-height:1.5;color:#626C8A}
.install-actions{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.install-actions button{padding:5px 0;border:0;background:none;font-size:13px;color:var(--accent);font-weight:500}
.install-actions button:last-child:not(:first-child){color:var(--muted);font-weight:400}
.install-steps{margin:18px 0;padding:0 0 0 27px}
.install-steps li{padding:0 0 15px 5px;font-size:15px}
.install-steps li::marker{color:var(--accent);font-weight:500}
.install-steps small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.install-icon{display:inline-flex;vertical-align:-4px;width:18px;height:20px;color:var(--accent)}
.install-sheet .note{margin:5px 0 0}
@keyframes fillAcross{from{transform:scaleX(.04);opacity:.65}to{transform:scaleX(1);opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pageIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:360px){.capture-card{padding:19px 15px 17px}.hero .fig{font-size:clamp(68px,20vw,88px)}.hero .fig.long{font-size:clamp(51px,16vw,72px)}.hero .fig.longer{font-size:clamp(35px,11vw,52px)}.hero-footer{flex-wrap:wrap;gap:4px}}
@media(prefers-reduced-motion:reduce){.app.is-entering,.meter i,.cat .bar i,.toast{animation:none!important} .btn,.tabs a,.tabs a::before,.row,.link,.opts button,.in{transition:none!important}}

:root{
  --accent:#F18A47;--accent-dark:#E27230;--accent-ink:#A54517;

:root[data-colour="green"]{--accent:#44A786;--accent-dark:#318A6D;--accent-ink:#206C52;--accent-soft:#EAF8F1;--accent-outline:#C8EBDA;--button-ink:#092B20;--hero-glow:rgba(68,167,134,.06)}

(function(){
  'use strict';
  const ios=/iPhone|iPad|iPod/i.test(navigator.userAgent)||navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1;
  const standalone=()=>navigator.standalone===true||Boolean(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
  const dismissed=()=>{try{return localStorage.getItem('pocket-ledger-install-dismissed')==='1'}catch{return false}};
  const shareIcon='<svg class="install-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-label="Share icon"><path d="M12 15V3m0 0 4 4m-4-4L8 7"/><path d="M5 12v8h14v-8"/></svg>';
  let returnFocus=null;

  window.homeGuideHTML=function(inSettings=false){
    if(!ios||standalone()||(!inSettings&&dismissed()))return '';
    return `<aside class="install-card" aria-label="Add Pocket Ledger to Home Screen"><span class="install-symbol" aria-hidden="true">+</span><div>
       <strong>Keep Ledger on your Home Screen</strong><p>Open it like an app, straight from your iPhone.</p>
       <div class="install-actions"><button type="button" data-install="show">How to add</button>${inSettings?'':`<button type="button" data-install="dismiss">Not now</button>`}</div>
       </div></aside>`;
  };

  function close(){const host=document.getElementById('install-root');if(!host||!host.firstElementChild)return;
    host.replaceChildren();document.body.classList.remove('dialog-open');
    if(returnFocus&&returnFocus.isConnected)returnFocus.focus({preventScroll:true});returnFocus=null;}
  function show(){if(!ios||standalone())return;returnFocus=document.activeElement;
    const safari=/Safari/i.test(navigator.userAgent)&&!/CriOS|FxiOS|EdgiOS|OPiOS/i.test(navigator.userAgent);
    const host=document.getElementById('install-root');if(!host)return;
    host.innerHTML=`<div class="scrim" data-install="backdrop"><section class="sheet install-sheet" role="dialog" aria-modal="true" aria-labelledby="install-title">
      <div class="eyebrow">POCKET LEDGER</div><h3 id="install-title" style="margin-top:12px">Add to Home Screen</h3>
      ${!safari?'<p class="note">Open this website in Safari first, then follow these steps.</p>':''}
      <ol class="install-steps"><li>Open Pocket Ledger in <strong>Safari</strong>.</li>
      <li>Tap ${shareIcon} <strong>Share</strong> in the Safari toolbar.<small>If Share is not visible, open the page menu first.</small></li>

      <li>Tap <strong>Add</strong> to confirm.</li></ol>
      <p class="note">Ledger opens without the Safari toolbar. Home Screen apps keep separate local storage from Safari, so existing entries do not transfer automatically. Download a backup in Safari Settings first, then import it from the installed app.</p>
      <div class="acts" style="margin-top:23px"><button type="button" class="btn push" data-install="close">Got it</button></div>
      </section></div>`;
    document.body.classList.add('dialog-open');host.querySelector('[data-install="close"]')?.focus({preventScroll:true});}

  document.addEventListener('click',event=>{
    const el=event.target.closest('[data-install]');if(!el)return;
    const type=el.dataset.install;
    if(type==='backdrop'&&event.target!==el)return;
    event.preventDefault();
    if(type==='show')show();
    else if(type==='dismiss'){try{localStorage.setItem('pocket-ledger-install-dismissed','1')}catch{};if(typeof render==='function')render();}
    else close();
  });
  document.addEventListener('keydown',event=>{
    const host=document.getElementById('install-root');if(!host?.firstElementChild)return;

    if(event.key==='Tab'){
      const controls=[...host.querySelectorAll('button:not([disabled])')];if(!controls.length)return;
      const first=controls[0],last=controls.at(-1);
      if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
      if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
    }
  });
})();

function dayLabel(s){const t=today();if(s===t)return"Today";if(s===addDays(t,-1))return"Yesterday";const d=toDate(s);return `${WD[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}

function parseMoney(str,allowNeg=false,allowZero=false){const s=String(str??"").replace(/hk\$|\$|,|\s/gi,"").replace("−","-");
  if(!/^-?(\d+\.?\d{0,2}|\.\d{1,2})$/.test(s))return null;const n=Math.round(parseFloat(s)*100);
  if(!Number.isSafeInteger(n)||(!allowZero&&n===0)||(!allowNeg&&n<0))return null;return n}

/* Financial month boundaries are anchored to calendar months. 29–31 use the
   last available day in a shorter month (including leap years). */
function cycleAnchor(year,monthIndex,startDay){
  const lastDay=new Date(year,monthIndex+1,0).getDate();
  return ymd(new Date(year,monthIndex,Math.min(startDay,lastDay)))}
function cycleBounds(ref=today(),day=S.settings.cycleStart){
  const d=toDate(ref),n=validCycleStart(day)?day:1;
  let y=d.getFullYear(),m=d.getMonth(),first=cycleAnchor(y,m,n);
  if(ref<first){m--;if(m<0){y--;m=11}first=cycleAnchor(y,m,n)}
  let nextM=m+1,nextY=y;if(nextM>11){nextM=0;nextY++}
  const next=cycleAnchor(nextY,nextM,n);
  return{first,last:addDays(next,-1),next}}
function cycleLabel(first,last){
  const a=toDate(first),b=toDate(last),crossYear=a.getFullYear()!==b.getFullYear();
  return `${shortDate(first)}${crossYear?` ${a.getFullYear()}`:""} – ${shortDate(last)}${crossYear?` ${b.getFullYear()}`:""}`}
function monthStats(ref=today()){
  const {first,last,next}=cycleBounds(ref);
  const spent=spendIn(first,last),budget=S.settings.budget||0;
  const utc=s=>{const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)};
  const daysLeft=Math.round((utc(last)-utc(ref))/864e5)+1;
  return{first,last,next,spent,budget,left:budget-spent,daysLeft,
    name:cycleLabel(first,last),calendarName:MONTHS_LONG[toDate(first).getMonth()]}}


/* Taxonomy is owned by the person, not the AI. Similarity checks run locally. */
const CATEGORY_HINTS={
  Food:["restaurant","restaurants","dining","takeaway","takeout","cafe","cafes","coffee","meals","餐飲","外食","飲食"],
  Groceries:["grocery","supermarket","supermarkets","market","超市","雜貨"],
  Transport:["taxi","taxis","bus","public transport","交通","車費"],
  Clothing:["clothes","clothing","fashion","apparel","服飾","衣服"],
  Shopping:["retail","general shopping","購物"],
  Entertainment:["leisure","movies","hobbies","娛樂","消遣"],
  Health:["medical","medicine","doctor","healthcare","醫療","藥物"],
  Bills:["utilities","subscriptions","subscription","utilities bills","帳單","訂閱"],
  Home:["household","furniture","家居"],
  Travel:["holidays","holiday","vacation","trip","旅行","旅遊"]
};
const categoryKey=s=>norm(String(s||"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"")).replace(/(?:ies|s)$/,(m)=>m==="ies"?"y":"");
function editDistance(a,b){const row=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){let prev=row[0];row[0]=i;for(let j=1;j<=b.length;j++){const hold=row[j];row[j]=Math.min(row[j]+1,row[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=hold}}return row[b.length]}
function relatedCategories(label){const k=categoryKey(label);if(!k)return [];
  return categories().filter(cat=>{const n=categoryKey(cat);
    if(n===k)return true;
    if(k.length>=4&&n.length>=4&&(k.includes(n)||n.includes(k)))return true;
    if(k.length>=5&&n.length>=5&&editDistance(k,n)<=2)return true;
    if(CATEGORY_HINTS[cat]?.some(v=>categoryKey(v)===k))return true;
    return false}).slice(0,4)}
function cleanCategory(value){return String(value||"").trim().replace(/\s+/g," ").replace(/[^\p{L}\p{N} &()+/]/gu,"").slice(0,28).trim()}
function addCategory(value,force=false){const name=cleanCategory(value),similar=relatedCategories(name);
  if(!name||name.length<2)return{error:"Enter at least two letters."};
  if(categories().some(c=>categoryKey(c)===categoryKey(name)))return{error:`${similar[0]||name} already exists.`};
  if(S.customCategories.length>=32)return{error:"You've reached the custom category limit. Merge similar ones first."};
  if(similar.length&&!force)return{similar,name};
  S.customCategories.push(name);S.aiResults={};aiCache.clear();persist();return{added:name}}
function mergeCategory(from,to){if(!S.customCategories.includes(from)||!categories().includes(to)||from===to)return false;
  for(const e of S.entries){if(e.category===from){e.category=to;if(e.status!=="approved")e.status="approved"}
    if(e.suggestedCategory===from)delete e.suggestedCategory}
  for(const[k,v]of Object.entries(S.dict))if(v===from)S.dict[k]=to;
  S.customCategories=S.customCategories.filter(x=>x!==from);S.aiResults={};aiCache.clear();persist();return true}
function applyAppearance(){const s=S.settings,root=document.documentElement;
  root.dataset.colour=COLOURWAYS[s.palette]?s.palette:"apricot";
  root.dataset.mode=THEME_MODES.includes(s.theme)?s.theme:"light";
  const dark=root.dataset.mode==="dark"||(root.dataset.mode==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content",dark?"#171819":"#FFFFFF");
}

/* Classification: local dictionary first, AI only for unseen labels */
function lookup(name){const k=norm(name);if(!k)return null;
  if(S.dict[k]&&categories().includes(S.dict[k]))return{cat:S.dict[k],src:"user"};
  if(AMBIGUOUS.has(k))return{cat:null,src:"ambiguous"};
  if(!S.settings.preferLocal&&aiReady())return null;
  if(BUILTIN.has(k))return{cat:BUILTIN.get(k),src:"builtin"};
  const toks=k.split(" ");
  for(const t of toks)if(S.dict[t]&&categories().includes(S.dict[t]))return{cat:S.dict[t],src:"user"};
  for(const t of toks)if(BUILTIN.has(t))return{cat:BUILTIN.get(t),src:"builtin"};
  for(const[key,cat]of BUILTIN)if(/[㐀-鿿]/.test(key)&&key.length>=2&&k.includes(key))return{cat,src:"builtin"};
  return null}
function categorize(e){
  if(e.type!=="purchase"){e.category=null;e.status="na";return false}
  const hit=lookup(e.name);
  if(hit){if(hit.src==="ambiguous"){e.category=null;e.status="review";e.why="Could be several kinds of purchase"}
    else{e.category=hit.cat;e.status=hit.src==="user"?"approved":"auto";delete e.why}return false}
  e.category=null;e.status="none";delete e.why;return true}
function setCategory(e,cat){
  if(!categories().includes(cat))return 0;
  delete e.suggestedCategory;
  delete S.aiResults[norm(e.name)];
  e.category=cat;e.status="approved";delete e.why;const k=norm(e.name);let others=0;
  if(k&&!AMBIGUOUS.has(k)&&e.type==="purchase"){S.dict[k]=cat;
    for(const o of S.entries)if(o!==e&&o.type==="purchase"&&norm(o.name)===k&&["none","review","ai","pending","auto"].includes(o.status)){o.category=cat;o.status="approved";delete o.why;others++}}
  return others}

/* OpenRouter (optional, BYOK). Only the short label and category list are sent. */
const aiCache=new Map();let aiChain=Promise.resolve();const aiPending=new Set();
function httpMsg(s,m){
  if(s===401)return"OpenRouter rejected the key. Check it, or create a new one.";
  if(s===402)return"No credit left, or the key reached its spending limit.";
  if(s===403)return"This model or provider isn't available for your account or region. The route has been switched off; choose another model.";
  if(s===404||s===400)return`That model isn't available${m?": "+m:". Check the model ID."}`;
  if(s===429)return"Rate limited. Try again in a minute.";
  return`OpenRouter error ${s}${m?": "+m:""}`}
async function classifyRemote(label,model=S.settings.model,key=S.settings.key){
  if(!navigator.onLine)throw new Error("You're offline. The entry is saved; categorise it later.");
  if(/^anthropic\//i.test(model)||/claude/i.test(model))throw new Error("Anthropic models are excluded from this project. Choose another model.");
  const allowed=categories(),propose=S.settings.suggestNew===true;
  const instruction=`Sort a Hong Kong purchase label. Use an EXACT existing category when possible: ${allowed.join(", ")}. Prefer existing broad categories over creating synonyms. Unclear means Review. ${propose?'If absolutely none fits, use Review and propose one short broad category in new_category. Never propose a synonym or narrower version of an existing category.':'Never propose a new category.'} JSON only: {"category":"existing name or Review"${propose?',"new_category":"short category or empty"':''}}.`;
  const body={model,temperature:0,max_tokens:75,usage:{include:true},
    provider:{ignore:["anthropic"],...(S.settings.deny?{data_collection:"deny"}:{})},
    messages:[{role:"system",content:instruction},{role:"user",content:label}]};
  const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),15000);let res;
  try{res=await fetch("https://openrouter.ai/api/v1/chat/completions",{method:"POST",signal:ctrl.signal,headers:{"Authorization":"Bearer "+key,"Content-Type":"application/json","X-Title":"Pocket Ledger"},body:JSON.stringify(body)})}
  catch(err){clearTimeout(timer);throw new Error(err.name==="AbortError"?"The provider took longer than 15 seconds. The entry is saved.":framed?"Couldn't reach OpenRouter. This Claude preview blocks outside requests; use your self-hosted copy.":"Couldn't reach OpenRouter. Check your connection.")}
  clearTimeout(timer);let data=null;try{data=await res.json()}catch{}
  if(!res.ok){const e=new Error(httpMsg(res.status,data?.error?.message||""));e.status=res.status;throw e}
  S.ai.requests++;if(typeof data?.usage?.cost==="number")S.ai.cost+=data.usage.cost;
  const text=data?.choices?.[0]?.message?.content||"";let j=null;try{j=JSON.parse((text.match(/\{[\s\S]*\}/)||[""])[0])}catch{}
  if(!j)throw new Error("The model replied in an unexpected format, so the entry stays uncategorised.");
  const cat=allowed.find(c=>categoryKey(c)===categoryKey(j.category));
  const candidate=propose?cleanCategory(j.new_category||""):"";
  const suggestions=candidate?relatedCategories(candidate):[];
  if(cat)return{category:cat,review:j.review_required===true};
  if(candidate&&!suggestions.length&&candidate.length>=2)return{category:null,review:true,newCategory:candidate};
  return{category:null,review:true,similar:suggestions}}
function queueAI(ids){
  for(const id of ids){const e=find(id);if(!e||aiPending.has(id))continue;aiPending.add(id);e.status="pending";
    aiChain=aiChain.then(()=>runAI(id)).catch(()=>{})}
  render()}
async function runAI(id){
  const e=find(id);if(!e||e.status!=="pending"){aiPending.delete(id);return}
  const k=norm(e.name),signature=categories().join("|")+"|"+S.settings.suggestNew;
  try{let r=aiCache.get(k+"|"+signature)||S.aiResults[k]?.signature===signature&&S.aiResults[k].result;
    if(!r){r=await classifyRemote(e.name);aiCache.set(k+"|"+signature,r);
      S.aiResults[k]={signature,result:r};const keys=Object.keys(S.aiResults);if(keys.length>300)delete S.aiResults[keys[0]]}
    const cur=find(id);if(cur&&cur.status==="pending"){
      if(r.newCategory){cur.category=null;cur.status="proposal";cur.suggestedCategory=r.newCategory;cur.why="New category suggested"}
      else if(r.review||!r.category){cur.category=null;cur.status="review";cur.why=r.similar?.length?"Similar to "+r.similar.join(", "):"AI wasn't sure"}
      else{cur.category=r.category;cur.status="ai";delete cur.suggestedCategory}}
    S.ai.lastError=""}
  catch(err){const cur=find(id);if(cur&&cur.status==="pending")cur.status="none";S.ai.lastError=err.message;if(err.status===403)S.settings.model=""}
  finally{aiPending.delete(id);persist();render()}}

function reconcileFeedback(logged,stmt){

  const diff=stmt-logged;
  if(diff===0)return `<p class="note">Matches the statement. Ready to reconcile.</p>`;
  return `<p class="note warn">${diff>0?`${money(diff)} missing from your log.`:`${money(-diff)} more in your log than on the statement.`}</p>
    <div class="acts" style="margin-top:4px">${diff>0?`<button class="link ink" data-act="new" data-preset="rec-past">Add missing entry</button>`:`<button class="link ink" data-act="rec-filter">Check entries</button>`}<button class="link ink" data-act="rec-adjust">Add ${money(diff,{sign:true})} adjustment</button></div>`}

  let ask=false,learned=0;
  if(e.type!=="purchase"){e.category=null;e.status="na"}
  else if(s.category){if(s.category!==prevCat||e.status!=="approved"||norm(prevName)!==norm(name))learned=setCategory(e,s.category)}
  else if(isNew||prevType!=="purchase"||norm(prevName)!==norm(name))ask=categorize(e);
  else if(prevCat){e.category=null;e.status="none"}
  persist();closeSheet();render();
  const id=e.id;
  toast(isNew?savedMsg(e):`Updated ${e.name}.${learned?` Applied to ${learned} more.`:""}`,isNew?()=>removeEntry(id):()=>{const i=S.entries.findIndex(x=>x.id===id);if(i>=0)S.entries[i]=JSON.parse(before);persist();render()});
  if(ask&&aiReady())queueAI([e.id])}

/* Category creation from a receipt or the review queue. */
let categoryModal=null;
function showCategoryModal(entryId=null){categoryModal={entryId,previous:document.activeElement,name:"",force:false};renderCategoryModal()}
function closeCategoryModal(){const a=categoryModal?.previous;categoryModal=null;$("category-root").replaceChildren();
  if(!sheet&&!$("install-root").firstElementChild)document.body.classList.remove("dialog-open");if(a?.isConnected)a.focus({preventScroll:true})}
function renderCategoryModal(message=""){if(!categoryModal)return;const m=categoryModal,similar=relatedCategories(m.name);
  $("category-root").innerHTML=`<div class="scrim" data-catmodal="backdrop"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="category-title"><div class="eyebrow">CATEGORY</div><h3 id="category-title" style="margin-top:12px">New category</h3>
    <label class="fld"><span>Category name</span><input id="new-category-name" class="in" value="${esc(m.name)}" maxlength="28" placeholder="e.g. Pet care" autocomplete="off"></label>
    <p class="note${message?" warn":""}" role="status">${esc(message||"Choose a broad category you'll use more than once. Similar categories are checked locally.")}</p>
    ${similar.length?`<p class="note">Related: ${similar.map(x=>esc(x)).join(", ")}</p>`:""}
    <div class="acts"><button class="link" data-catmodal="cancel">Cancel</button><button class="btn push" data-catmodal="save">${m.force?"Add anyway":"Add category"}</button></div>
  </section></div>`;
  document.body.classList.add("dialog-open");$("new-category-name")?.focus({preventScroll:true})}
function saveCategoryModal(){if(!categoryModal)return;const m=categoryModal,result=addCategory(m.name,m.force);
  if(result.similar){m.force=true;renderCategoryModal(`Similar to ${result.similar.join(", ")}. Choose an existing category, or add anyway.`);return}
  if(result.error){renderCategoryModal(result.error);return}
  if(m.entryId){const e=find(m.entryId);if(e)setCategory(e,result.added)}
  else if(sheet){sheet.category=result.added}
  closeCategoryModal();persist();if(sheet)renderSheet();render();toast(`${result.added} added.`)}

/* Backup */
function backupJSON(){const{settings,...rest}=S;const{key,...safe}=settings;return JSON.stringify({app:"pocket-ledger",version:1,exported:new Date().toISOString(),...rest,settings:safe},null,1)}
function importData(text){let p;try{p=JSON.parse(text)}catch{toast("That file isn't a Pocket Ledger backup.");return}
  if(!p||p.app!=="pocket-ledger"||p.version!==1||!Array.isArray(p.entries)||!Array.isArray(p.card||[])){
    toast("That file isn't a valid Pocket Ledger backup.");return}
  const types=["purchase","unknown","adjustment","repayment"],statuses=["na","none","review","proposal","pending","auto","ai","approved"];
  const importedCategories=Array.isArray(p.customCategories)?p.customCategories:[];
  if(importedCategories.length>32||!importedCategories.every(x=>typeof x==="string"&&x.length<=28&&x.length>=2)||new Set(importedCategories.map(categoryKey)).size!==importedCategories.length){toast("The backup has invalid custom categories.");return}
  const validCategories=[...BASE_CATEGORIES,...importedCategories];
  const goodEntry=e=>e&&typeof e.id==="string"&&/^[a-zA-Z0-9_-]{1,80}$/.test(e.id)&&typeof e.name==="string"&&e.name.length<=80&&
    validDate(e.date)&&Number.isSafeInteger(e.amount)&&(e.type==="adjustment"?e.amount!==0:e.amount>0)&&types.includes(e.type)&&
    (e.category==null||validCategories.includes(e.category))&&statuses.includes(e.status)&&typeof e.created==="string"&&!Number.isNaN(Date.parse(e.created));
  const goodCard=c=>c&&validDate(c.date)&&Number.isSafeInteger(c.bal)&&c.bal>=0;
  if(!p.entries.every(goodEntry)||!(p.card||[]).every(goodCard)||new Set(p.entries.map(e=>e.id)).size!==p.entries.length){
    toast("Some records in this backup are invalid. Nothing was imported.");return}
  const goodRecon=r=>r&&validDate(r.from)&&validDate(r.to)&&r.from<=r.to&&Number.isSafeInteger(r.logged)&&
    (r.statement===null||Number.isSafeInteger(r.statement))&&Number.isSafeInteger(r.adj)&&
    (r.snapshot===undefined||(typeof r.snapshot==="string"&&r.snapshot.length<1000000));
  if(p.recon?.log!==undefined&&(!Array.isArray(p.recon.log)||!p.recon.log.every(goodRecon))){
    toast("This backup has invalid reconciliation data. Nothing was imported.");return}
  const prev=JSON.stringify(S),d=defaults(),key=S.settings.key;
  const dict=Object.fromEntries(Object.entries(p.dict||{}).filter(([k,v])=>typeof k==="string"&&k.length<=80&&validCategories.includes(v)));
  const opts=p.settings||{},ai=p.ai||{};
  const recon={last:validDate(p.recon?.last)?p.recon.last:null,log:p.recon?.log||[]};
  const safeAI={requests:Number.isSafeInteger(ai.requests)&&ai.requests>=0?ai.requests:0,
    cost:Number.isFinite(ai.cost)&&ai.cost>=0?ai.cost:0,lastError:typeof ai.lastError==="string"?ai.lastError.slice(0,400):""};
  S={...d,entries:p.entries,dict,customCategories:importedCategories,aiResults:{},card:p.card||[],recon,ai:safeAI,
    settings:{...d.settings,budget:Number.isSafeInteger(opts.budget)&&opts.budget>=0?opts.budget:d.settings.budget,
      currency:safeCurrency(opts.currency),ai:opts.ai===true,model:typeof opts.model==="string"?opts.model.slice(0,150):"",
      deny:opts.deny!==false,preferLocal:opts.preferLocal!==false,suggestNew:opts.suggestNew!==false,
      palette:COLOURWAYS[opts.palette]?opts.palette:"apricot",theme:THEME_MODES.includes(opts.theme)?opts.theme:"light",
      cycleStart:validCycleStart(opts.cycleStart)?opts.cycleStart:1,key},seeded:true};
  applyAppearance();persist();render();toast(`Imported ${S.entries.length} entries.`,()=>{S=JSON.parse(prev);persist();render()})}

/* Actions */
const ACT={
  "toggle-unknown":()=>{draft.unknown=!draft.unknown;capErr="";render();(draft.unknown?$("cap-amt"):$("cap-name"))?.focus()},
  pick:el=>{draft.name=el.dataset.label;draft.unknown=false;render();$("cap-amt")?.focus()},
  edit:el=>openSheet(el.dataset.id),
  new:el=>{const p=el.dataset.preset,t=today();
    if(p==="past")openSheet(null,{date:addDays(t,-1)});else if(p==="repayment")openSheet(null,{type:"repayment"});
    else if(p==="rec-past")openSheet(null,{date:recDraft.to});else openSheet(null)},
  filter:el=>{receiptFilter=el.dataset.f;render()},
  setcat:el=>{const e=find(el.dataset.id);if(!e)return;const n=setCategory(e,el.dataset.cat);persist();render();toast(`${e.name}: ${el.dataset.cat}.${n?` Applied to ${n} more.`:""}`)},
  palette:el=>{S.settings.palette=el.dataset.v;applyAppearance();persist();render()},
  theme:el=>{S.settings.theme=el.dataset.v;applyAppearance();persist();render()},
  "add-category":()=>{const result=addCategory(categoryDraft,categoryConfirm===categoryDraft);
    if(result.similar){categoryConfirm=categoryDraft;categoryFeedback=`Similar to ${result.similar.join(", ")}. Use the existing category, or add anyway.`;render();return}
    if(result.error){categoryConfirm="";categoryFeedback=result.error;render();return}
    categoryConfirm="";categoryFeedback="";categoryDraft="";render();toast(`${result.added} added.`)},
  "cancel-category":()=>{categoryConfirm="";categoryFeedback="";render()},
  "merge-category":el=>{const from=el.dataset.cat,to=mergeChoice[from];if(!to){toast("Choose the category to merge into.");return}
    const prev=JSON.stringify(S);
    if(mergeCategory(from,to)){delete mergeChoice[from];render();toast(`${from} merged into ${to}.`,()=>{S=JSON.parse(prev);persist();render()})}} ,
  "accept-proposal":el=>{const e=find(el.dataset.id);if(!e||!e.suggestedCategory)return;
    showCategoryModal(e.id);categoryModal.name=e.suggestedCategory;renderCategoryModal()},
  "ai-confirm-all":()=>{const l=S.entries.filter(e=>e.type==="purchase"&&e.status==="ai");l.forEach(e=>setCategory(e,e.category));persist();render();toast(`Kept ${l.length}.`)},
  "ai-all":()=>queueAI(S.entries.filter(e=>e.type==="purchase"&&e.status==="none").map(e=>e.id)),
  "rec-adjust":()=>{const logged=spendIn(recDraft.from,recDraft.to),stmt=parseMoney(recDraft.stmt,false,true);if(stmt==null)return;const diff=stmt-logged;if(!diff)return;
    const e={id:uid(),name:`Reconcile ${shortDate(recDraft.from)} to ${shortDate(recDraft.to)}`,amount:diff,date:recDraft.to,created:new Date().toISOString(),type:"adjustment",category:null,status:"na"};
    S.entries.push(e);persist();render();toast(`Added ${money(diff,{sign:true})} adjustment.`,()=>removeEntry(e.id))},
  "rec-filter":()=>{receiptFilter="all";location.hash="#receipt"},
  "rec-mark":()=>{const logged=spendIn(recDraft.from,recDraft.to),stmt=parseMoney(recDraft.stmt,false,true);
    if(stmt===null){toast("Enter the statement purchases first.");$("rec-stmt")?.focus();return}
    if(stmt!==logged){toast("Resolve the difference before marking this period reconciled.");return}
    const adj=S.entries.filter(e=>e.type==="adjustment"&&e.date>=recDraft.from&&e.date<=recDraft.to).reduce((a,e)=>a+e.amount,0);
    const prev=JSON.stringify(S.recon);S.recon.last=!S.recon.last||recDraft.to>S.recon.last?recDraft.to:S.recon.last;
    S.recon.log.push({from:recDraft.from,to:recDraft.to,logged,statement:stmt,adj,snapshot:rangeSnapshot(recDraft.from,recDraft.to),at:new Date().toISOString()});
    const to=recDraft.to;recDraft=null;persist();render();toast(`Reconciled to ${shortDate(to)}.`,()=>{S.recon=JSON.parse(prev);persist();render()})},
  "card-save":()=>{const bal=parseMoney(cardDraft.bal,false,true);if(bal==null){toast("Enter a valid statement balance, including zero.");$("card-bal")?.focus();return}
    S.card=S.card.filter(c=>c.date!==cardDraft.date);S.card.push({date:cardDraft.date,bal});cardDraft={bal:"",date:today()};persist();render();toast("Balance saved.")},
  "clear-examples":()=>{const prev=JSON.stringify(S);S.entries=S.entries.filter(e=>!e.example);S.card=S.card.filter(c=>!c.example);persist();render();toast("Examples cleared.",()=>{S=JSON.parse(prev);persist();render()})},
  "toggle-key":()=>{showKey=!showKey;render()},
  "remove-key":()=>{S.settings.key="";S.settings.ai=false;testMsg="";persist();render();toast("Key removed.")},
  "load-models":async()=>{modelMsg="Loading…";render();
    try{const r=await fetch("https://openrouter.ai/api/v1/models");const j=await r.json();
      models=j.data.filter(m=>!/^anthropic\//i.test(m.id)&&!/claude/i.test(m.id)).map(m=>({id:m.id,name:m.name||"",p:+(m.pricing?.prompt||0),c:+(m.pricing?.completion||0)}));
      if(!modelQuery)modelQuery="qwen";modelMsg=""}
    catch{modelMsg=framed?"The preview blocks outside requests. Use your self-hosted copy.":"Couldn't load the list. Check your connection."}
    render()},
  "pick-model":el=>{S.settings.model=el.dataset.id;testMsg="";persist();render()},
  test:async()=>{testMsg="Testing…";render();const t0=performance.now();
    try{const r=await classifyRemote("MTR");testMsg=`Connected. "MTR" is ${r.category||"Review"}, ${Math.round(performance.now()-t0)} ms.`;S.ai.lastError=""}
    catch(err){testMsg=err.message;if(err.status===403)S.settings.model=""}
    persist();render()},
  "reset-usage":()=>{S.ai.requests=0;S.ai.cost=0;persist();render()},
  forget:el=>{delete S.dict[el.dataset.k];persist();render()},
  "copy-backup":async()=>{const txt=backupJSON();try{await navigator.clipboard.writeText(txt);backupText="";render();toast("Backup copied.")}catch{backupText=txt;render();$("p-backup")?.select()}},
  "download-backup":()=>{if(framed){toast("Downloads are blocked in the preview. Use Copy backup.");return}
    try{const url=URL.createObjectURL(new Blob([backupJSON()],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download=`pocket-ledger-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}catch{}},
  erase:()=>{if(!armed.erase){armed.erase=true;render();setTimeout(()=>{armed.erase=false;render()},4000);return}
    armed.erase=false;const prev=JSON.stringify(S);S=defaults();S.seeded=true;applyAppearance();persist();render();toast("Everything erased.",()=>{S=JSON.parse(prev);applyAppearance();persist();render()})}
};

$("main").addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;e.preventDefault();ACT[el.dataset.act]?.(el)});
$("main").addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="cap")saveCapture()});
$("main").addEventListener("keydown",e=>{if(e.key!=="Enter"||e.target.id!=="cap-name")return;e.preventDefault();
  if(draft.amt.trim()||/\d$/.test(draft.name.trim()))saveCapture();else $("cap-amt")?.focus()});
$("main").addEventListener("input",e=>{const t=e.target,d=t.dataset;
  if(d.draft&&d.draft!=="date"){draft[d.draft]=t.value;if(capErr){capErr="";t.closest("form")?.querySelector(".err")?.replaceChildren()}}
  else if(d.rec){recDraft[d.rec]=t.value;if(d.rec==="stmt")refreshReconcile()}
  else if(d.card)cardDraft[d.card]=t.value;
  else if(d.mq){modelQuery=t.value;const results=document.querySelector(".models");if(results)results.innerHTML=modelOptionsHTML()}
  else if(d.set&&t.type!=="checkbox"){S.settings[d.set]=d.set==="currency"?safeCurrency(t.value):d.set==="model"||d.set==="key"?t.value.trim():t.value;testMsg="";persist()}});
$("main").addEventListener("change",e=>{const t=e.target,d=t.dataset;
  if(d.draft==="date"){draft.date=t.value||today();render()}
  else if(d.rec&&t.type==="date"){recDraft[d.rec]=t.value||today();render()}
  else if(d.card==="date")cardDraft.date=t.value||today();
  else if(d.cycle){const n=Number(t.value);if(validCycleStart(n)){S.settings.cycleStart=n;persist()}render();toast(`Financial month now starts on day ${S.settings.cycleStart}.`)}
  else if(d.num){const v=parseMoney(t.value);if(v!=null){S.settings[d.num]=v;persist()}render()}
  else if(d.set&&t.type==="checkbox"){S.settings[d.set]=t.checked;persist();
    if(d.set==="ai"&&t.checked&&!(S.settings.key&&S.settings.model))toast("Add a key and a model to get suggestions.");render()}
  else if(d.set==="currency"){S.settings.currency=safeCurrency(t.value);persist();render()}
  else if(t.id==="p-import"&&t.files?.[0]){t.files[0].text().then(importData);t.value=""}});
$("sheet-root").addEventListener("click",e=>{
  if(e.target.classList.contains("scrim")){closeSheet();return}
  const el=e.target.closest("[data-sact]");if(!el)return;const a=el.dataset.sact;
  if(a==="type"){sheet.type=el.dataset.v;sheet.err="";renderSheet()}
  else if(a==="recent"){sheet.name=el.dataset.label;renderSheet();$("s-amt")?.focus()}
  else if(a==="custom-category")showCategoryModal();
  else if(a==="cancel")closeSheet();
  else if(a==="save")saveSheet();
  else if(a==="delete"){if(!sheet.armed){sheet.armed=true;renderSheet();return}const e0=find(sheet.id);const snap=JSON.stringify(e0);removeEntry(sheet.id);closeSheet();
    toast(`Deleted ${e0.name}.`,()=>{S.entries.push(JSON.parse(snap));persist();render()})}});
$("sheet-root").addEventListener("input",e=>{const k=e.target.dataset.s;if(k&&sheet){sheet[k]=e.target.value;sheet.err=""}});
$("sheet-root").addEventListener("change",e=>{const k=e.target.dataset.s;if(k&&sheet)sheet[k]=e.target.value});
$("sheet-root").addEventListener("keydown",e=>{
  if(categoryModal)return;
  if(e.key==="Tab"&&sheet){const f=[...$("sheet-root").querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled])')].filter(x=>x.getClientRects().length);
    if(!f.length)return;const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&(document.activeElement===first||!$("sheet-root").contains(document.activeElement))){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&(document.activeElement===last||!$("sheet-root").contains(document.activeElement))){e.preventDefault();first.focus()}}
  if(e.key==="Enter"&&e.target.tagName==="INPUT"&&!e.isComposing){e.preventDefault();saveSheet()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheet&&!categoryModal)closeSheet()});
document.getElementById("new-tab").addEventListener("click",()=>openSheet(null));
$("main").addEventListener("change",e=>{if(e.target.dataset.reviewCat){const entry=find(e.target.dataset.reviewCat),cat=e.target.value;
  if(!entry||!categories().includes(cat))return;const n=setCategory(entry,cat);persist();render();toast(`${entry.name}: ${cat}.${n?` Applied to ${n} more.`:""}`)}
  if(e.target.dataset.merge!==undefined)mergeChoice[e.target.dataset.merge]=e.target.value});
$("main").addEventListener("input",e=>{if(e.target.dataset.categoryInput){categoryDraft=e.target.value;categoryConfirm="";categoryFeedback=""}});
$("category-root").addEventListener("input",e=>{if(e.target.id==="new-category-name"&&categoryModal){categoryModal.name=e.target.value;categoryModal.force=false}});
$("category-root").addEventListener("click",e=>{const b=e.target.closest("[data-catmodal]");if(!b)return;
  const a=b.dataset.catmodal;if(a==="backdrop"&&e.target!==b)return;
  if(a==="cancel"||a==="backdrop")closeCategoryModal();else if(a==="save")saveCategoryModal()});
$("category-root").addEventListener("keydown",e=>{if(!categoryModal)return;
  if(e.key==="Escape"){closeCategoryModal();return}if(e.key==="Enter"&&e.target.id==="new-category-name"){e.preventDefault();saveCategoryModal()}
  if(e.key==="Tab"){const a=[...$("category-root").querySelectorAll('input:not([disabled]),button:not([disabled])')];
    if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}
    else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}});
window.matchMedia("(prefers-color-scheme: dark)")?.addEventListener?.("change",()=>{if(S.settings.theme==="system")applyAppearance()});
window.addEventListener("hashchange",route);

load();
// New installations start empty. Demo entries must never affect real spending totals.
for(const e of S.entries)if(e.status==="pending")e.status="none";
if(!framed&&/^(https:|http:\/\/localhost)/.test(location.href)){const l=document.createElement("link");l.rel="manifest";l.href="manifest.webmanifest";document.head.appendChild(l);
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})}
route();
</script>
